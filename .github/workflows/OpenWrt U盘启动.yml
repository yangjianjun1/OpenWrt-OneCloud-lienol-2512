name: Build OneCloud U盘启动

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: openwrt-24.10
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: onecloud.config
  DIY_P1_SH: op1.sh
  DIY_P2_SH: op2.sh
  DIY_P3_SH: op3.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: false
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load onecloud
      run: |
        [ -e target ] && cp -rf target openwrt/

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Remove some feeds
      run: |
        chmod +x $DIY_P3_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P3_SH

    - name: Second update feed
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Generate direct burn
      run: |
        sudo apt install -y android-sdk-libsparse-utils
        ver="v0.3.1"
        curl -L -o ./AmlImg https://github.com/lxiaya/AmlImg/releases/download/$ver/AmlImg_${ver}_linux_amd64
        chmod +x ./AmlImg
        curl -L -o ./uboot.img https://github.com/lxiaya/u-boot-onecloud/releases/download/build-20230901-0443/eMMC.burn.img
        ./AmlImg unpack ./uboot.img burn/
        # 安全解压 .gz（无匹配时不会报错）
        shopt -s nullglob
        gz_files=(openwrt/bin/targets/*/*/*.gz)
        if [ ${#gz_files[@]} -gt 0 ]; then
          gunzip openwrt/bin/targets/*/*/*.gz
        fi
        # 找到 .img 文件
        img_files=(openwrt/bin/targets/*/*/*.img)
        if [ ${#img_files[@]} -eq 0 ]; then
          echo "错误：未找到 .img 文件"
          exit 1
        fi
        diskimg="${img_files[0]}"
        loop=$(sudo losetup --find --show --partscan -r "$diskimg")
        boot_img="openwrt.img"
        boot_img_mnt="xd"
        rootfs_img_mnt="img"
        sudo rm -rf "$boot_img" "$boot_img_mnt" "$rootfs_img_mnt"
        sudo dd if=/dev/zero of="$boot_img" bs=1M count=400
        sudo mkfs.ext4 "$boot_img"
        sudo mkdir -p "$boot_img_mnt" "$rootfs_img_mnt"
        sudo mount "$boot_img" "$boot_img_mnt"
        sudo mount -r "${loop}p2" "$rootfs_img_mnt"
        cd "$rootfs_img_mnt"
        sudo cp -r * ../"$boot_img_mnt"
        cd ..
        sudo sync
        sudo umount "$boot_img_mnt"
        sudo umount "$rootfs_img_mnt"
        sudo img2simg "${loop}p1" burn/boot.simg
        sudo img2simg openwrt.img burn/rootfs.simg
        sudo rm -rf openwrt.img
        sudo losetup -d "$loop"
        cat <<EOF >> burn/commands.txt
        PARTITION:boot:sparse:boot.simg
        PARTITION:rootfs:sparse:rootfs.simg
        EOF
        # 打包 burn.img
        prefix=$(basename "$diskimg" .img)
        target_dir=$(dirname "$diskimg")
        burnimg="${target_dir}/${prefix}.burn.img"
        ./AmlImg pack "$burnimg" burn/
        # 压缩并生成校验文件（直刷包）
        for f in openwrt/bin/targets/*/*/*.burn.img; do
          [ -f "$f" ] && sha256sum "$f" > "${f}.sha"
          [ -f "$f" ] && xz -9 --threads=0 --compress "$f"
        done
        # 生成 U 盘安装包（combined 镜像，可直接 dd 到 U 盘启动）
        shopt -s nullglob
        for usb_img in openwrt/bin/targets/*/*/*combined*.img; do
          [ -f "$usb_img" ] || continue
          xz -9 --threads=0 --compress -k "$usb_img"
          sha256sum "${usb_img}.xz" > "${usb_img}.xz.sha"
        done
        # 清理中间文件（仅删除未压缩的 .img 和 .gz，保留 .xz 和 .sha）
        sudo rm -f openwrt/bin/targets/*/*/*.img
        sudo rm -f openwrt/bin/targets/*/*/*.gz

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt-l2410_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        shopt -s nullglob
        target_dirs=(openwrt/bin/targets/*/*)
        if [ ${#target_dirs[@]} -eq 0 ]; then
          echo "错误：未找到 targets 输出目录"
          exit 1
        fi
        echo "FIRMWARE=${target_dirs[0]}" >> $GITHUB_ENV
        rm -rf "${target_dirs[0]}/packages"
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt-l2410_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=OneCloud-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        echo "📦 OpenWrt OneCloud Firmware" > release.txt
        echo "" >> release.txt
        echo "**编译时间**: $(date +"%Y-%m-%d %H:%M")" >> release.txt
        echo "**源码分支**: ${{ env.REPO_BRANCH }}" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: |
          ${{ env.FIRMWARE }}/*.xz
          ${{ env.FIRMWARE }}/*.sha

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 2

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
